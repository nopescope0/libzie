name: Windows uygulaması

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install pywebview pyinstaller
      - name: Derle
        run: pyinstaller --noconfirm --windowed --name libzie --icon assets/icon.ico --add-data "static;static" app.py
      - name: Paketin doğru dosyaları içerdiğini denetle
        run: |
          if (-not (Test-Path dist/libzie/libzie.exe)) { throw "libzie.exe yok" }
          if (-not (Test-Path dist/libzie/_internal/static/index.html)) { throw "static/index.html pakete girmemiş" }
          if (-not (Test-Path dist/libzie/_internal/static/vendor/pdf.min.js)) { throw "vendor dosyaları pakete girmemiş" }
      - name: Zip
        run: Compress-Archive -Path dist/libzie -DestinationPath libzie-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: libzie-windows
          path: libzie-windows.zip
      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: libzie-windows.zip
