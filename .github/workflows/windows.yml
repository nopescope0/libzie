name: Windows uygulaması

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Derleme işi yalnızca okur; sürüm yayınlama yetkisi (yazma) sadece aşağıdaki "yayinla" işinde var.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Üçüncü taraf ve resmi action'lar etiket yerine tam commit'e sabitlenir (etiketler sonradan kaydırılabilir)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install pywebview==6.2.1 pyinstaller==6.22.3

      - name: Sürüm numarasını yaz
        env:
          REF_NAME: ${{ github.ref_name }}  # etiket adı betiğe doğrudan gömülmez (komut enjeksiyonunu önler)
        run: |
          # Uygulama içi güncelleme denetimi bu numarayı etiketle karşılaştırır (v0.1.3 → 0.1.3)
          $v = $env:REF_NAME.TrimStart("v")
          if ($v -match '^\d+(\.\d+)*$') {
            $t = [IO.File]::ReadAllText("guncelleme.py")
            $t = [regex]::Replace($t, '(?m)^VERSION = ".*"', "VERSION = `"$v`"")
            [IO.File]::WriteAllText("guncelleme.py", $t, (New-Object Text.UTF8Encoding $false))
            if (-not (Select-String -Path guncelleme.py -Pattern "^VERSION = `"$([regex]::Escape($v))`"" -Quiet)) { throw "guncelleme.py sürümü yazılamadı" }
          }

      # Kurulum sihirbazı için klasör çıktısı (hızlı açılır), taşınabilir sürüm için tek dosya
      - name: Derle (klasör, kurulum için)
        run: pyinstaller --noconfirm --windowed --onedir --name libzie --icon assets/icon.ico --add-data "static;static" app.py
      - name: Derle (tek dosya, taşınabilir)
        run: pyinstaller --noconfirm --windowed --onefile --name libzie --icon assets/icon.ico --add-data "static;static" --distpath dist-portable --workpath build-portable app.py

      - name: Çıktıları denetle
        run: |
          if (-not (Test-Path dist/libzie/libzie.exe)) { throw "dist/libzie/libzie.exe yok" }
          if (-not (Test-Path dist/libzie/_internal/static/index.html)) { throw "static/index.html pakete girmemiş" }
          $mb = [math]::Round((Get-Item dist-portable/libzie.exe).Length / 1MB, 1)
          Write-Host "taşınabilir libzie.exe: $mb MB"
          if ($mb -lt 5) { throw "libzie.exe beklenenden çok küçük; static/vendor paketlenmemiş olabilir" }

      - name: Kurulum sihirbazını derle (Inno Setup)
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          choco install innosetup -y --no-progress
          $v = $env:REF_NAME.TrimStart("v")
          if (-not ($v -match '^\d+(\.\d+)*$')) { $v = "0.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer/libzie.iss
          if (-not (Test-Path dist-installer/libzie-kurulum.exe)) { throw "libzie-kurulum.exe oluşmadı" }

      - name: Dosyaları topla
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist-installer/libzie-kurulum.exe release/
          Copy-Item dist-portable/libzie.exe release/libzie-tasinabilir.exe
          # İndirenlerin dosyayı doğrulayabilmesi için SHA-256 özetleri
          Get-ChildItem release/*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libzie-windows
          path: release/*

  yayinla:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libzie-windows
          path: release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/libzie-kurulum.exe
            release/libzie-tasinabilir.exe
            release/SHA256SUMS.txt
