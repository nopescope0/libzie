name: Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# The build job only reads; the permission to publish a release (write) exists only in the "publish" job below.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Third-party and official actions are pinned to a full commit instead of a tag (tags can be moved later)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pywebview==6.2.1 pyinstaller==6.22.3

      - name: Write the version number
        env:
          REF_NAME: ${{ github.ref_name }}  # the tag name is not embedded in the script directly (prevents command injection)
        run: |
          # The in-app update check compares this number with the tag (v0.1.3 → 0.1.3)
          $v = $env:REF_NAME.TrimStart("v")
          if ($v -match '^\d+(\.\d+)*$') {
            $t = [IO.File]::ReadAllText("updater.py")
            $t = [regex]::Replace($t, '(?m)^VERSION = ".*"', "VERSION = `"$v`"")
            [IO.File]::WriteAllText("updater.py", $t, (New-Object Text.UTF8Encoding $false))
            if (-not (Select-String -Path updater.py -Pattern "^VERSION = `"$([regex]::Escape($v))`"" -Quiet)) { throw "updater.py version could not be written" }
          }

      # A folder output for the setup wizard (opens fast), a single file for the portable version
      - name: Build (folder, for the installer)
        run: pyinstaller --noconfirm --windowed --onedir --name libzie --icon assets/icon.ico --add-data "static;static" app.py
      - name: Build (single file, portable)
        run: pyinstaller --noconfirm --windowed --onefile --name libzie --icon assets/icon.ico --add-data "static;static" --distpath dist-portable --workpath build-portable app.py

      - name: Check the outputs
        run: |
          if (-not (Test-Path dist/libzie/libzie.exe)) { throw "dist/libzie/libzie.exe is missing" }
          if (-not (Test-Path dist/libzie/_internal/static/index.html)) { throw "static/index.html did not get into the package" }
          $mb = [math]::Round((Get-Item dist-portable/libzie.exe).Length / 1MB, 1)
          Write-Host "portable libzie.exe: $mb MB"
          if ($mb -lt 5) { throw "libzie.exe is much smaller than expected; static/vendor may not have been packaged" }

      - name: Build the setup wizard (Inno Setup)
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          choco install innosetup -y --no-progress
          $v = $env:REF_NAME.TrimStart("v")
          if (-not ($v -match '^\d+(\.\d+)*$')) { $v = "0.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer/libzie.iss
          if (-not (Test-Path dist-installer/libzie-setup.exe)) { throw "libzie-setup.exe was not created" }

      - name: Collect the files
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist-installer/libzie-setup.exe release/
          Copy-Item dist-portable/libzie.exe release/libzie-portable.exe
          # Versions up to 0.1.6 look for the old (Turkish) file names when updating themselves; identical copies keep them updating
          Copy-Item dist-installer/libzie-setup.exe release/libzie-kurulum.exe
          Copy-Item dist-portable/libzie.exe release/libzie-tasinabilir.exe
          # SHA-256 digests so that downloaders can verify the files
          Get-ChildItem release/*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libzie-windows
          path: release/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libzie-windows
          path: release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/libzie-setup.exe
            release/libzie-portable.exe
            release/libzie-kurulum.exe
            release/libzie-tasinabilir.exe
            release/SHA256SUMS.txt
