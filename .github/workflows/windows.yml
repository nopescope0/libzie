name: Windows uygulaması

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install pywebview pyinstaller
      - name: Derle (tek dosya)
        run: pyinstaller --noconfirm --windowed --onefile --name libzie --icon assets/icon.ico --add-data "static;static" app.py
      - name: Çıktıyı denetle
        run: |
          if (-not (Test-Path dist/libzie.exe)) { throw "libzie.exe yok" }
          $mb = [math]::Round((Get-Item dist/libzie.exe).Length / 1MB, 1)
          Write-Host "libzie.exe: $mb MB"
          if ($mb -lt 5) { throw "libzie.exe beklenenden çok küçük; static/vendor paketlenmemiş olabilir" }
      - uses: actions/upload-artifact@v4
        with:
          name: libzie-windows
          path: dist/libzie.exe
      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/libzie.exe
